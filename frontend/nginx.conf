# Serves the SPA and forwards /api to the backend from the same origin.
#
# This is the local stand-in for the CloudFront distribution: one origin, two
# behaviours - static assets from disk (S3 in AWS) and /api/* proxied to the API
# (the ALB in AWS). Because it is one origin, the browser makes no cross-origin
# requests and no CORS applies, which is the same property the deployed stack has.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json;
    gzip_min_length 1024;

    # Hashed filenames are immutable, so they can be cached indefinitely.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # index.html must never be cached, or a deploy would keep serving the old bundle's
    # asset references.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location /api/ {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /healthz {
        proxy_pass http://api:8000/healthz;
        proxy_set_header Host $host;
    }

    # Client-side routes are not files on disk, so anything unmatched falls back to the
    # SPA entry point rather than returning 404.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
